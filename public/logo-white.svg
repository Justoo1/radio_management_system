<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Radio Icon -->
  <g transform="translate(30, 30)">
    <!-- Center Point -->
    <circle cx="0" cy="0" r="4" fill="white"/>

    <!-- Radio Waves - Left -->
    <path d="M -12 -8 Q -15 0 -12 8" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M -20 -13 Q -25 0 -20 13" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- Radio Waves - Right -->
    <path d="M 12 -8 Q 15 0 12 8" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M 20 -13 Q 25 0 20 13" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Text "RMS" -->
  <text x="65" y="40" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">
    RMS
  </text>
</svg>
