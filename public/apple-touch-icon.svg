<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded Rectangle Background -->
  <rect width="180" height="180" rx="40" fill="url(#appleGradient)"/>

  <!-- Radio Wave Icon -->
  <g transform="translate(90, 90)">
    <!-- Center Broadcast Point -->
    <circle cx="0" cy="0" r="7" fill="white"/>

    <!-- Radio Waves - Left Side -->
    <path d="M -22 -13 Q -27 0 -22 13" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M -35 -22 Q -45 0 -35 22" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M -48 -30 Q -60 0 -48 30" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.4"/>

    <!-- Radio Waves - Right Side -->
    <path d="M 22 -13 Q 27 0 22 13" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 35 -22 Q 45 0 35 22" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 48 -30 Q 60 0 48 30" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Sound Wave Bars at Bottom -->
  <g transform="translate(90, 135)">
    <rect x="-35" y="-7" width="5" height="14" fill="white" opacity="0.9" rx="2.5"/>
    <rect x="-24" y="-10" width="5" height="20" fill="white" opacity="0.9" rx="2.5"/>
    <rect x="-13" y="-5" width="5" height="10" fill="white" opacity="0.9" rx="2.5"/>
    <rect x="-2" y="-12" width="5" height="24" fill="white" opacity="0.9" rx="2.5"/>
    <rect x="9" y="-8" width="5" height="16" fill="white" opacity="0.9" rx="2.5"/>
    <rect x="20" y="-6" width="5" height="12" fill="white" opacity="0.9" rx="2.5"/>
    <rect x="31" y="-9" width="5" height="18" fill="white" opacity="0.9" rx="2.5"/>
  </g>
</svg>
