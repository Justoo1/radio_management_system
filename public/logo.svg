<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F472B6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main Circle Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)"/>

  <!-- Radio Wave Icon -->
  <g transform="translate(100, 100)">
    <!-- Center Microphone/Broadcast Point -->
    <circle cx="0" cy="0" r="8" fill="white"/>

    <!-- Radio Waves - Left Side -->
    <path d="M -25 -15 Q -30 0 -25 15" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M -40 -25 Q -50 0 -40 25" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M -55 -35 Q -70 0 -55 35" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.4"/>

    <!-- Radio Waves - Right Side -->
    <path d="M 25 -15 Q 30 0 25 15" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 40 -25 Q 50 0 40 25" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 55 -35 Q 70 0 55 35" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Sound Wave Bars at Bottom -->
  <g transform="translate(100, 155)">
    <rect x="-40" y="-8" width="6" height="16" fill="white" opacity="0.9" rx="3"/>
    <rect x="-28" y="-12" width="6" height="24" fill="white" opacity="0.9" rx="3"/>
    <rect x="-16" y="-6" width="6" height="12" fill="white" opacity="0.9" rx="3"/>
    <rect x="-4" y="-14" width="6" height="28" fill="white" opacity="0.9" rx="3"/>
    <rect x="8" y="-10" width="6" height="20" fill="white" opacity="0.9" rx="3"/>
    <rect x="20" y="-7" width="6" height="14" fill="white" opacity="0.9" rx="3"/>
    <rect x="32" y="-11" width="6" height="22" fill="white" opacity="0.9" rx="3"/>
  </g>
</svg>
