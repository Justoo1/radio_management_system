# AzuraCast Development Environment
# Radio Management System - Streaming Feature
#
# Usage:
#   Start:   docker compose up -d
#   Stop:    docker compose down
#   Logs:    docker compose logs -f azuracast
#   Shell:   docker compose exec azuracast bash
#
# Access:
#   Web UI:  http://localhost:8080
#   Stream:  http://localhost:8000/radio.mp3

services:
  azuracast:
    image: ghcr.io/azuracast/azuracast:latest
    container_name: rms_azuracast
    restart: unless-stopped
    ports:
      # Web interface
      - "8080:80"
      - "8443:443"
      # Icecast streaming ports
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
      - "8003:8003"
      - "8004:8004"
      - "8005:8005"
      - "8006:8006"
      - "8007:8007"
      - "8008:8008"
      - "8009:8009"
      - "8010:8010"
      # SFTP for file uploads (optional)
      - "2022:2022"
    volumes:
      # Persistent data storage
      - azuracast_station_data:/var/azuracast/stations
      - azuracast_backups:/var/azuracast/backups
      - azuracast_db_data:/var/lib/mysql
      - azuracast_sftpgo_data:/var/azuracast/sftpgo/persist
    environment:
      # Application Environment
      - AZURACAST_DC_REVISION=15
      # Note: Using production mode for stable frontend assets
      # - APPLICATION_ENV=development

      # Initial Setup (used only on first run)
      - INIT_BASE_URL=localhost:8080
      - INIT_INSTANCE_NAME=RMS Development
      - INIT_ADMIN_EMAIL=admin@rms.local
      - INIT_ADMIN_PASSWORD=rmsadmin123

      # Timezone (Ghana)
      - TZ=Africa/Accra

      # Enable development features
      - ENABLE_REDIS=true
      - ENABLE_WEB_UPDATER=false

      # Database settings
      - MYSQL_RANDOM_ROOT_PASSWORD=yes

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    # Resource limits (adjust based on your machine)
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

volumes:
  azuracast_station_data:
    name: rms_azuracast_station_data
  azuracast_backups:
    name: rms_azuracast_backups
  azuracast_db_data:
    name: rms_azuracast_db_data
  azuracast_sftpgo_data:
    name: rms_azuracast_sftpgo_data

networks:
  default:
    name: rms_streaming_network
